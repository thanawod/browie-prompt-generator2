<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browie Close-up Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7EBDD;--panel:#FFF8F0;--line:#E2C9A6;--ink:#2B1A12;--muted:#7A5E48;--accent:#A24022;--accent-ink:#FFF8F0;--tan:#B49365;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1510;--panel:#2A1D16;--line:#4A3527;--ink:#F4E4D0;--muted:#C2A488;--accent:#D2663F;--accent-ink:#1E1510;--tan:#A88660}}
:root[data-theme="dark"]{--bg:#1E1510;--panel:#2A1D16;--line:#4A3527;--ink:#F4E4D0;--muted:#C2A488;--accent:#D2663F;--accent-ink:#1E1510;--tan:#A88660}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-weight:900;font-size:clamp(28px,4.4vw,46px);line-height:1.02;margin:0;letter-spacing:-.02em}
h1 svg{display:block;width:clamp(120px,16vw,190px);height:auto;margin-bottom:6px}
.lede{color:var(--muted);max-width:56ch;margin:6px 0 0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.group{padding:18px 0;border-top:1px solid var(--line)}
.group:first-child{border-top:0;padding-top:0}
.group h2{font-size:16px;font-weight:700;margin:0 0 2px}
.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--tan)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.shades{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:560px){.shades{grid-template-columns:1fr}}
.shade{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.shade img{display:block;width:100%;height:84px;object-fit:cover}
.shade div{padding:8px 10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.shade small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.shade .sw{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.2)}
.shade[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
textarea,input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.out{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px}
@media (max-width:900px){.out{position:static}}
.out h2{font-size:18px;font-weight:700;margin:0 0 4px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.btn{border:0;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:8px 14px}
.btn.small{font-size:12.5px;padding:5px 10px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:10px;color:var(--muted)}
.toggle input{margin-top:4px;accent-color:var(--accent)}
.sum{font-size:13px;color:var(--muted);margin:0}
.qc label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer}
.qc label:last-child{border-bottom:0}
.qc input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.score{font-weight:900;font-size:40px;line-height:1;color:var(--accent)}
.verdict{font-weight:600}
.lib{display:grid;gap:12px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0;font-size:16px;font-weight:700}
.card .meta{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.card .pv{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><svg viewBox="0 0 200 40" aria-hidden="true"><path d="M6 30 C40 8, 90 4, 150 14 C170 17, 184 22, 194 28" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/><path d="M6 30 C40 12, 88 9, 148 18" fill="none" stroke="var(--tan)" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg>Close-up Prompt Builder</h1>
      <p class="lede">Bentuk alis selalu mengikuti foto model. Tool ini hanya mengatur warna shade, tekstur serat alis, dan detail kulit supaya hasil close-up terlihat seperti foto asli, bukan AI.</p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="build">Susun prompt</button>
      <button role="tab" aria-selected="false" data-tab="lib">Library <span id="libCount"></span></button>
    </div>
  </header>

  <section id="tab-build" class="grid">
    <div id="controls"></div>
    <aside class="out" aria-live="polite">
      <h2>Prompt siap pakai</h2>
      <p class="sum" id="summary"></p>
      <div class="lbl">Prompt utama <button class="btn small" data-copy="main">Salin</button></div>
      <div class="box" id="mainOut"></div>
      <div id="negWrap"><div class="lbl">Negative prompt <button class="btn small" data-copy="neg">Salin</button></div><div class="box" id="negOut"></div></div>
      <label class="toggle" id="mergeRow"><input type="checkbox" id="merge" checked> Gabungkan larangan ke prompt utama. Nyalakan untuk ChatGPT atau generator tanpa kolom negative prompt.</label>
      <label class="toggle"><input type="checkbox" id="ref" checked> <span id="refTxt"></span></label>
      <div class="lbl" style="margin-top:22px">Cek hasil generate</div>
      <div class="qc" id="qc"></div>
      <div class="row" style="align-items:center"><span class="score" id="qcScore">0/8</span> <span class="verdict" id="qcVerdict"></span></div>
      <div class="row"><input type="text" id="saveName" placeholder="Nama prompt, misal: Dark Brown – macro dewy" style="flex:1;min-width:180px"><button class="btn" id="saveBtn">Simpan ke library</button></div>
    </aside>
  </section>
  <section id="tab-lib" hidden><div class="lib" id="libList"></div></section>
</div>
<div class="toast" id="toast"></div>

  SHADES.forEach(s=>{
    const b=document.createElement("button"); b.type="button"; b.className="shade"; b.setAttribute("aria-pressed",state.shade===s.id);
    b.innerHTML=`<img src="${IMG[s.id]}" alt="Patokan alis ${s.l}"><div><span class="sw" style="background:${s.c}"></span><span>${s.l}<small>${s.hex}</small></span></div>`;
    b.onclick=()=>{state.shade=s.id;renderControls();build();};
    g.querySelector(".shades").appendChild(b);
  });
  c.appendChild(g);
  const cg=document.createElement("div"); cg.className="group";
  cg.innerHTML=`<h2>Kondisi alis</h2><p class="hint">Bisa pilih lebih dari satu. "Sesuai foto" mengunci bentuk alis asli. Untuk foto before, kombinasikan dengan Tanpa shade.</p><div class="chips"></div>`;
  CONDS.forEach(cd=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=cd.l;b.setAttribute("aria-pressed",state.cond.includes(cd.id));
    b.onclick=()=>{if(cd.id==="asli")state.cond=["asli"];else{let a=state.cond.filter(x=>x!=="asli");a=a.includes(cd.id)?a.filter(x=>x!==cd.id):[...a,cd.id];state.cond=a.length?a:["asli"];}renderControls();build();};
    cg.querySelector(".chips").appendChild(b);});
  if(state.cond.includes("custom")){const ci=document.createElement("textarea");ci.rows=2;ci.style.marginTop="10px";ci.placeholder='Deskripsikan alisnya, lebih baik bahasa Inggris. Misal: "very thin over-plucked 90s brows with a high sharp arch"';ci.value=state.condCustom;ci.oninput=e=>{state.condCustom=e.target.value;build();};cg.appendChild(ci);}
  c.appendChild(cg);
  for(const k in OPTS){
    const o=OPTS[k], d=document.createElement("div"); d.className="group";
    d.innerHTML=`<h2>${o.title}</h2><p class="hint">${o.hint||""}</p><div class="chips"></div>`;
    o.items.forEach(it=>{
      const b=document.createElement("button"); b.className="chip"; b.type="button"; b.setAttribute("aria-pressed",state[k]===it.id); b.textContent=it.l;
      b.onclick=()=>{state[k]=it.id;renderControls();build();};
      d.querySelector(".chips").appendChild(b);
    });
    if(k==="crop") d.style.opacity=state.mode==="closeup"?1:.5;
    if(k==="pig"&&state.shade==="none"){d.style.opacity=.5;d.querySelector(".hint").textContent="Tidak dipakai saat Tanpa shade.";}
    if(k==="target"&&state.target==="gemini") d.querySelector(".hint").textContent="Tips Gemini: upload foto model dulu (Image 1), lalu potongan alis tanpa wajah (Image 2). Untuk close-up, lebih aman crop foto model dulu lalu pakai mode Perbaiki detail.";
    c.appendChild(d);
  }
  const n=document.createElement("div"); n.className="group";
  n.innerHTML=`<h2>Catatan tambahan</h2><p class="hint">Opsional, lebih baik dalam bahasa Inggris. Misal: "keep the brush in her hand".</p><textarea rows="2"></textarea>`;
  const ta=n.querySelector("textarea"); ta.value=notes; ta.oninput=e=>{notes=e.target.value;build();};
  c.appendChild(n);
}

const changed=()=>!state.cond.includes("asli");
function condText(){const p=CONDS.filter(c=>state.cond.includes(c.id)&&c.p).map(c=>c.p);if(state.cond.includes("custom")&&state.condCustom.trim())p.push(state.condCustom.trim());return p.join("; ")||"natural, untouched brows";}
function condLabel(){return CONDS.filter(c=>state.cond.includes(c.id)).map(c=>c.l.toLowerCase()).join(" + ");}
function NEG2(sid,ch){const none=sid==="none",it=[];
  if(!none&&!ch)it.push("faded, washed-out, sheer or patchy brow color, brows lighter than the reference");
  it.push("AI-smooth skin, plastic or waxy skin, airbrushed, beauty filter, blurred or missing pores, over-sharpened halos, painted or drawn brows, marker or tattoo look, copy-paste identical hairs");
  if(!ch)it.push("solid block fill, microblading cut lines, hard brow outline, changed brow shape, brows moved, thickened or lifted, perfectly parallel hair strokes, all stray hairs removed");
  else it.push("perfectly groomed or laminated brows, filled-in brows, brow makeup, clean sharp brow edges");
  if(!none)it.push("jet black or blue-black brows, "+(sid==="brown"?"orange brows":"reddish or orange brows"));
  else it.push("henna stain, tinted or dyed look, brow pencil or pomade");
  it.push("changed face or identity, altered eyes, extra makeup, CGI, 3D render, illustration, text, watermark");return it.join(", ");}
function qcList(){const ch=changed(),none=state.shade==="none";return[
  ch?"Kondisi alis sesuai pilihan dan terlihat alami":"Bentuk dan posisi alis sama dengan foto asli model",
  none?"Warna alis tetap natural, tidak ada efek tint":"Warna pekat dan jelas sesuai shade, tidak pudar, tidak hitam legam, tidak oranye",
  "Helai alis terlihat satu per satu, tidak seperti blok cat",
  ch?"Alis tidak terlihat rapi atau seperti habis dibentuk":"Kepala alis bergradasi lembut dengan helai mengarah ke atas",
  none?"Tidak ada noda tint di kulit, tekstur kulit terlihat":"Kulit di bawah alis ternoda tint, tekstur kulit masih terlihat",
  "Pori, bulu halus, dan garis halus kulit terlihat jelas","Kilap kulit natural, tidak licin seperti plastik","Wajah, mata, dan hijab tidak berubah"];}
function build(){
  const s=shade(), f=pick("finish"), dt=pick("detail"), cr=pick("crop"), pg=pick("pig"), mode=state.mode, ch=changed(), none=s.id==="none";
  $("#mergeRow").hidden=state.target==="gemini";
  $("#ref").closest("label").hidden=none;
  $("#refTxt").textContent=state.target==="gemini"?"Saya melampirkan potongan alis patokan (tanpa wajah) sebagai Image 2.":"Saya ikut melampirkan foto patokan shade ini saat generate.";
  renderQC();
  if(state.target==="gemini") return buildGemini(s,f,dt,cr,pg,mode,ch,none);
  const lock=ch?"Use the attached photo of the model as the base. Keep her face, identity, eye shape, hijab, makeup, lighting direction and background exactly the same. Change ONLY the eyebrows, as described below, keeping them in their natural position on the brow bone."
    :"Use the attached photo of the model as the base. Keep her face, identity, eye shape, hijab, makeup, lighting direction and background exactly the same. Keep the eyebrow SHAPE, thickness, arch and position exactly as in the original photo: do not redraw, reshape, lift or thicken the brows.";
  const what=ch?"Change only the eyebrows as described below":none?"Refine only the natural brow hair texture":"Refine only the brow color and hair texture";
  let task;
  if(mode==="closeup") task=`Recompose it as ${cr.p} of the same photo, as if shot with a 100mm macro lens, keeping true-to-life proportions. ${what}, and render the skin at full macro detail.`;
  else if(mode==="enhance"||ch||none) task=`Keep the same framing and composition. ${what}, and bring back real skin detail.`;
  else task="Keep the same framing and composition. Change only the brow color to the shade below and refine the hair texture; do not touch anything else.";
  const color=none?`Color: ${s.p}`:`Color: ${s.p} ${pg.p}`;
  let brow;
  if(ch) brow=`Eyebrows: ${condText()}. They must look like real, untouched brows photographed up close: individual hairs with tapered tips, varied in length, thickness and direction, with real skin visible between them.${none?"":` The henna ${pg.st}.`}`;
  else brow=none?TEXTURE.replace(" (match the reference)","").replace("The henna __STAIN__, so the brow looks filled while skin texture still shows through.","Skin texture shows through between the hairs."):TEXTURE.replace("__STAIN__",pg.st);
  let main=`${lock}\n\n${task}\n\n${color}\n\n${brow}\n\n${SKIN(f.p)}\n\n${dt.p}`;
  if($("#ref").checked&&!none) main+=ch?`\n\nThe attached ${s.l} reference image is only for tint color and skin realism. Do not copy its brow density, shape, face or composition.`:`\n\nThe attached ${s.l} reference image is only for brow hair texture, tint color and skin texture. Do not copy the reference face, brow shape or composition.`;
  if(notes.trim()) main+=`\n\nAdditional direction: ${notes.trim()}`;
  const neg=NEG2(s.id,ch), merge=$("#merge").checked;
  if(merge) main+=`\n\nAvoid: ${neg}.`;
  $("#mainOut").textContent=main; $("#negOut").textContent=neg; $("#negWrap").hidden=merge;
  $("#summary").textContent=`${pick("mode").l}${mode==="closeup"?", "+cr.l.toLowerCase():""}. Alis ${condLabel()}, ${s.l}${none?"":" "+pg.l.toLowerCase()}, kulit ${f.l.toLowerCase()}.`;
  window._cur={main,neg:merge?"":neg};
}
function buildGemini(s,f,dt,cr,pg,mode,ch,none){
  const ref=$("#ref").checked&&!none;
  const imgs=ref?"Image 1 is the photo of the model. Image 2 is only a close-up swatch of eyebrow hair and color, with no face.":"Image 1 is the photo of the model.";
  const keep=ch?"Keep the exact same woman from Image 1: the same face, features, skin tone, eyes, hijab and expression. This is an edit of her photo, not a new person. Only her eyebrows change."
    :"Keep the exact same woman from Image 1: the same face, features, skin tone, eyes, hijab and expression, and the same eyebrow shape, thickness and position. This is an edit of her photo, not a new person.";
  const task=mode==="closeup"?`Zoom in to ${cr.p}, keeping her real proportions.`:"Keep the same framing.";
  const col=s.p.replace(/^Browie [A-Za-z ]+ henna tint: /,"");
  const tex="fine individual hairs with tapered tips, sparser upward-brushed hairs at the brow head fading into the skin, denser hairs angled toward the tail in natural layers, a clean but soft lower edge and a thin tapered tail";
  let brow;
  if(ch) brow=`Eyebrows: make them ${condText()}${none?", in her own natural hair color with no tint":`, tinted with henna in ${col} ${pg.p}`}. They must look like real untouched brows: individual hairs with tapered tips and real skin visible between them.${ref?" Use Image 2 only for the tint color.":""}`;
  else if(none) brow=`Eyebrows: keep her natural brow color with no tint or makeup. Refine the texture: ${tex}.`;
  else brow=`Eyebrows: recolor them with henna brow tint in ${col} ${pg.p} ${ref?"Copy the hair texture and color of Image 2: ":"Texture: "}${tex}.`;
  const no=none?"no tint or makeup on the brows":ch?"no groomed or drawn-on look":"no faded brow color, no drawn or blocky brows";
  let main=`Edit Image 1. ${imgs}\n\n${keep}\n\n${task}\n\n${brow}\n\nSkin: real unretouched macro skin with visible pores, peach fuzz, fine lines around the eyes, slightly uneven natural tone, and ${f.p}. ${dt.p}\n\nNo airbrushed or plastic skin, ${no}.${notes.trim()?"\n\n"+notes.trim():""}\n\nThe face must stay identical to Image 1.`;
  $("#mainOut").textContent=main; $("#negWrap").hidden=true;
  $("#summary").textContent=`Gemini. ${pick("mode").l}. Alis ${condLabel()}, ${s.l}, kulit ${f.l.toLowerCase()}.`;
  window._cur={main,neg:""};
}
function renderQC(){
  const q=$("#qc"); q.innerHTML="";
  qcList().forEach((t,i)=>{const l=document.createElement("label");l.innerHTML=`<input type="checkbox" ${qc[i]?"checked":""}><span>${t}</span>`;l.querySelector("input").onchange=e=>{qc[i]=e.target.checked;score();};q.appendChild(l);});
  score();
}
function score(){const n=qc.filter(Boolean).length;$("#qcScore").textContent=`${n}/${QC.length}`;$("#qcVerdict").textContent=n===QC.length?"Layak pakai":n>=6?"Hampir, cek poin yang kosong":n>0?"Perlu generate ulang":"";}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast("Tersalin");}catch{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Tersalin");}catch{toast("Gagal menyalin, blok teksnya manual");}a.remove();}}
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy==="main"?window._cur.main:window._cur.neg));
$("#merge").onchange=build; $("#ref").onchange=build;

const LS="browieCloseupLib.v1";
function loadLib(){try{return JSON.parse(localStorage.getItem(LS))||[]}catch{return[]}}
function saveLib(l){try{localStorage.setItem(LS,JSON.stringify(l));return true}catch{return false}}
$("#saveBtn").onclick=()=>{
  const name=$("#saveName").value.trim()||`${shade().l} – ${condLabel()} – ${pick("mode").l}`;
  const lib=loadLib();
  lib.unshift({id:Date.now(),name,state:{...state},notes,merge:$("#merge").checked,ref:$("#ref").checked,main:window._cur.main,neg:window._cur.neg,score:qc.filter(Boolean).length,date:new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})});
  if(saveLib(lib)){toast("Tersimpan di library");$("#saveName").value="";qc.fill(false);renderQC();renderLib();}else toast("Penyimpanan browser tidak tersedia");
};
function renderLib(){
  const lib=loadLib(), el=$("#libList");
  $("#libCount").textContent=lib.length?`(${lib.length})`:"";
  if(!lib.length){el.innerHTML=`<div class="empty">Belum ada prompt tersimpan. Setelah hasil generate lolos cek, klik <b>Simpan ke library</b> supaya bisa dipakai ulang.</div>`;return;}
  el.innerHTML="";
  lib.forEach(it=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<h3></h3><div class="meta">${it.date} · skor cek ${it.score}/${QC.length}</div><div class="pv"></div><div class="row"><button class="btn small" data-a="use">Pakai lagi</button><button class="btn ghost small" data-a="copy">Salin prompt</button><button class="btn ghost small" data-a="del">Hapus</button></div>`;
    c.querySelector("h3").textContent=it.name;c.querySelector(".pv").textContent=it.main;
    c.querySelector('[data-a=use]').onclick=()=>{state={...DEF,...it.state,cond:it.state.cond||["asli"]};notes=it.notes||"";$("#merge").checked=it.merge!==false;$("#ref").checked=it.ref!==false;renderControls();build();switchTab("build");toast("Pengaturan dimuat");};
    c.querySelector('[data-a=copy]').onclick=()=>copy(it.main+(it.neg?`\n\nNegative: ${it.neg}`:""));
    const del=c.querySelector('[data-a=del]');del.onclick=()=>{if(del.dataset.sure){saveLib(loadLib().filter(x=>x.id!==it.id));renderLib();toast("Dihapus");}else{del.dataset.sure=1;del.textContent="Klik lagi untuk hapus";}};
    el.appendChild(c);
  });
}
function switchTab(t){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));$("#tab-build").hidden=t!=="build";$("#tab-lib").hidden=t!=="lib";}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
renderControls();build();renderQC();renderLib();
</script>
</body>
</html>
